{% if show_link and visit.get_stage_url %}
<a href="{{ visit.get_stage_url }}" class="badge {{ badge_class }} text-decoration-none" style="cursor:pointer;" title="Click to go to {{ visit.get_status_display }}">
    <i class="bi bi-box-arrow-in-right me-1"></i>{{ visit.get_status_display }}
</a>
{% else %}
<span class="badge {{ badge_class }}">{{ visit.get_status_display }}</span>
{% endif %}
